# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-json"
exclude = '^(\.vscode/.*\.json|ui/tsconfig\.(app|node)\.json)$'

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"



[[repos]]
repo = "local"

[[repos.hooks]]
id = "betterleaks"
name = "betterleaks secret scan"
entry = """bash -c 'BL=$(command -v betterleaks || command -v /opt/homebrew/bin/betterleaks || command -v /usr/local/bin/betterleaks || command -v "$HOME/.local/bin/betterleaks" || command -v "$HOME/.cargo/bin/betterleaks" || command -v /c/ProgramData/chocolatey/bin/betterleaks || command -v "$USERPROFILE/scoop/shims/betterleaks.exe" || command -v "$LOCALAPPDATA/Microsoft/WinGet/Links/betterleaks.exe" || command -v "/c/Program Files/betterleaks/betterleaks.exe" 2>/dev/null); if [ -z "$BL" ]; then GL=$(command -v gitleaks || command -v /opt/homebrew/bin/gitleaks || command -v /usr/local/bin/gitleaks || command -v "$HOME/.local/bin/gitleaks" || command -v "$HOME/.cargo/bin/gitleaks" || command -v /c/ProgramData/chocolatey/bin/gitleaks || command -v "$USERPROFILE/scoop/shims/gitleaks.exe" || command -v "$LOCALAPPDATA/Microsoft/WinGet/Links/gitleaks.exe" || command -v "/c/Program Files/Gitleaks/gitleaks.exe" 2>/dev/null) || { echo "gitleaks not found, skipping"; exit 0; }; "$GL" git --redact=80 --no-banner --timeout 2 -v --max-target-megabytes=2 --pre-commit --staged; else "$BL"; fi'"""
language = "system"
pass_filenames = false


