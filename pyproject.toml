[project]
name = "autotrader-web-scapper"
version = "0.1.1"
description = "Selenium-based scraper for autotrader.co.uk vehicle listings"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pysentry-rs>=0.4.7",
    "selenium>=4.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ty.environment]
python = ".venv"
